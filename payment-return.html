<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Mbare Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f90;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .checkmark { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <div class="spinner"></div>
        <h2>Processing Your Payment...</h2>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('paynowreference') || urlParams.get('reference') || urlParams.get('transaction');
        const amount = urlParams.get('amount');
        
        if (transactionId) {
            localStorage.setItem('payment_success', 'true');
            localStorage.setItem('payment_transaction', transactionId);
            localStorage.setItem('payment_amount', amount || '1.50');
            document.getElementById('statusContainer').innerHTML = `
                <div class="checkmark success">✅</div>
                <h2 class="success">Payment Successful!</h2>
                <p>Redirecting to dashboard...</p>
            `;
        } else {
            localStorage.setItem('payment_cancelled', 'true');
            document.getElementById('statusContainer').innerHTML = `
                <div class="checkmark error">❌</div>
                <h2 class="error">Payment Issue</h2>
                <p>Redirecting...</p>
            `;
        }
        
        setTimeout(() => { window.location.href = 'seller-dashboard.html'; }, 3000);
    </script>
</body>
</html>
