<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Mbare Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f90;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .warning { color: #f90; }
        .checkmark { font-size: 60px; margin-bottom: 20px; }
        button { background: #f90; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; width: 100%; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <div class="spinner"></div>
        <h2>Processing Your Payment...</h2>
        <p>Please wait while we verify your payment...</p>
    </div>

        <script src="js/pages/payment-return.js"></script>
</body>
</html>
