<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hardware | Mbare Marketplace</title>
    <meta name="description" content="Shop hardware - tools, building materials, ironmongery, paint, and more at Mbare Marketplace.">
    
    <link rel="canonical" href="https://www.mbaremarketplace.com/category-hardware.html">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .category-header {
            background: linear-gradient(135deg, #232f3e, #1a2533);
            color: white;
            padding: 15px 0;
            text-align: center;
            position: relative;
        }
        
        .slider-container {
            display: grid;
            gap: 10px;
            padding: 0 15px;
            grid-template-columns: repeat(4, 1fr);
            position: relative;
        }

        .slide-panel {
            position: relative;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: #1a2533;
        }

        .slide-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
        }

        .slider-overlay-text {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        .category-header h1 {
            font-size: 22px;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 5px;
        }
        
        .category-header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .filter-bar {
            background: white;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .filter-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .category-breadcrumb { padding: 12px 0; background: #f8f9fa; font-size: 14px; }
        .category-breadcrumb a { color: #232f3e; text-decoration: none; }
        .category-breadcrumb a:hover { color: #f90; }

        .contact-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow-y: auto;
            padding: 20px 0;
        }
        .contact-modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideDown 0.3s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .close-contact-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            z-index: 10;
        }
        .close-contact-modal:hover {
            color: #000;
        }
        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .info-icon {
            width: 40px;
            height: 40px;
            background: #232f3e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .info-text {
            flex: 1;
            min-width: 0;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 500;
            color: #232f3e;
            word-wrap: break-word;
        }
        .contact-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .contact-btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .contact-btn:hover {
            opacity: 0.9;
        }
        .call-btn {
            background: #28a745;
            color: white;
        }
        .whatsapp-btn {
            background: #25D366;
            color: white;
        }
        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #232f3e;
            padding-right: 30px;
        }

        @media (min-width: 769px) {
            .slider-container { grid-template-columns: repeat(4, 1fr); }
            .slide-panel:nth-child(4) { display: block; }
        }

        @media (max-width: 768px) {
            .slider-container { grid-template-columns: repeat(3, 1fr) !important; }
            .slide-panel:nth-child(4) { display: none; }
            .slide-panel { height: 140px; }
            .category-header h1 { font-size: 18px; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .contact-actions { flex-direction: column; }
            .contact-btn { width: 100%; }
        }
    </style>
</head>
<body data-category="hardware">

    <div id="sellerContactModal" class="contact-modal">
        <div class="contact-modal-content">
            <span class="close-contact-modal" onclick="document.getElementById('sellerContactModal').style.display='none'">&times;</span>
            <div id="sellerContactContent"></div>
        </div>
    </div>

    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo"><a href="index.html">Mbare Marketplace</a></div>
                <div class="search-bar">
                    <select class="search-category" id="searchCategory">
                        <option>All</option>
                        <option selected>Hardware</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search hardware..." class="search-input">
                    <button class="search-btn" onclick="handleSearch()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                    </button>
                </div>
                <div class="header-right">
                    <div class="account-menu" id="accountMenu">
                        <span class="account-label">Hello, Sign in</span>
                        <a href="login.html" class="account-link">Account & Lists</a>
                        <button id="logoutBtn" class="logout-btn" onclick="logout()" style="display: none;">Logout</button>
                    </div>
                    <a href="Basket.html" class="basket">
                        <div class="basket-icon">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <path d="M16 10a4 4 0 0 1-8 0"></path>
                            </svg>
                            <span class="basket-count" id="basketCount">0</span>
                        </div>
                        <span class="basket-text">Basket</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="category-breadcrumb">
        <div class="container"><a href="index.html">Home</a> > <span>Hardware</span></div>
    </div>

    <section class="category-header">
        <div class="container">
            <div class="slider-container" id="heroSlider">
                <div class="slide-panel"><img src="hardware/1.jpg" alt="hardware" id="slideImg1"></div>
                <div class="slide-panel"><img src="hardware/2.jpg" alt="hardware" id="slideImg2"></div>
                <div class="slide-panel"><img src="hardware/3.jpg" alt="hardware" id="slideImg3"></div>
                <div class="slide-panel"><img src="hardware/4.jpg" alt="hardware" id="slideImg4"></div>
                
                <div class="slider-overlay-text">
                    <h1> Hardware</h1>
                    <p>All your building and repair needs</p>
                </div>
            </div>
        </div>
    </section>

    <div class="filter-bar">
        <div class="container">
            <div class="results-count" id="resultsCount">Loading products...</div>
            <select id="sortSelect" class="sort-select" onchange="sortProducts()">
                <option value="newest">Newest First</option>
                <option value="price_low">Price: Low to High</option>
                <option value="price_high">Price: High to Low</option>
            </select>
        </div>
    </div>

    <main class="main-content">
        <div class="container">
            <div class="product-grid" id="hardwareGrid"></div>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="auth-check.js"></script>
    
            <script src="js/category-config.js"></script>
    <script src="js/category-page.js"></script>
</body>
</html>
