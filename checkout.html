<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with EcoCash - Mbare Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #131921 0%, #232f3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .checkout-card {
            background: white;
            max-width: 450px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header {
            background: #FFD814;
            padding: 24px;
            text-align: center;
        }
        .card-header h2 {
            color: #111;
            margin-bottom: 8px;
        }
        .card-header .price {
            font-size: 32px;
            font-weight: 800;
            color: #B12704;
        }
        .card-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #FFD814;
        }
        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }
        .btn-pay {
            background: #FFD814;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-pay:hover {
            background: #F7CA00;
        }
        .btn-pay:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FFD814;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }
        .info-message {
            background: #e2f0fa;
            color: #004b8f;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #0066c0;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <div class="card-header">
            <h2 id="planName">Mbare Marketplace</h2>
            <div class="price" id="planPrice">$0.00</div>
            <p style="font-size: 14px; margin-top: 8px;">Monthly Subscription</p>
        </div>
        <div class="card-body">
            <div id="paymentSection">
                <div class="form-group">
                    <label>EcoCash Number</label>
                    <input type="tel" id="phoneNumber" placeholder="0771234567" autocomplete="off">
                    <div class="help-text">Enter your registered EcoCash number starting with 077 or 078</div>
                </div>
                <div class="form-group">
                    <label>Email Address (optional)</label>
                    <input type="email" id="email" placeholder="you@example.com">
                    <div class="help-text">For payment receipt</div>
                </div>
                <button class="btn-pay" id="payButton" onclick="processPayment()">Pay with EcoCash</button>
            </div>
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <div>Sending payment request to your phone...</div>
                <div style="font-size: 13px; margin-top: 10px; color: #666;">Check your EcoCash and enter your PIN</div>
            </div>
            <div id="result"></div>
            <div class="back-link">
                <a href="seller-dashboard.html">← Back to Dashboard</a>
            </div>
        </div>
    </div>

        <script src="js/pages/checkout.js"></script>
</body>
</html>
