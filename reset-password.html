<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://www.mbaremarketplace.com/reset-password.html">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Mbare Marketplace</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E %3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== RESET PASSWORD PAGE – GLASSMORPHISM ===== */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 20% 50%, #0a1628 0%, #050d1a 100%);
            padding: 20px;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Background bubbles */
        .bubble-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble-bg span {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(179, 136, 255, 0.06), rgba(124, 77, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: floatBubble linear infinite;
        }

        .bubble-bg span:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -100px;
            animation-duration: 25s;
            animation-delay: 0s;
        }
        .bubble-bg span:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -150px;
            animation-duration: 30s;
            animation-delay: 3s;
        }
        .bubble-bg span:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 40%;
            right: 10%;
            animation-duration: 20s;
            animation-delay: 5s;
        }
        .bubble-bg span:nth-child(4) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            left: 5%;
            animation-duration: 18s;
            animation-delay: 8s;
        }
        .bubble-bg span:nth-child(5) {
            width: 500px;
            height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
            animation-delay: 2s;
            background: radial-gradient(circle at 30% 30%, rgba(179, 136, 255, 0.03), rgba(124, 77, 255, 0.01));
        }

        @keyframes floatBubble {
            0% { transform: translate(0,0) scale(1) rotate(0deg); opacity:0.3; }
            25% { transform: translate(30px,-40px) scale(1.05) rotate(5deg); opacity:0.6; }
            50% { transform: translate(-20px,20px) scale(0.95) rotate(-3deg); opacity:0.4; }
            75% { transform: translate(40px,-20px) scale(1.02) rotate(2deg); opacity:0.5; }
            100% { transform: translate(0,0) scale(1) rotate(0deg); opacity:0.3; }
        }

        /* Container – Glassmorphism */
        .reset-container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
        }

        .reset-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 40px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo a {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #b388ff, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(179, 136, 255, 0.2);
            letter-spacing: -0.5px;
        }

        .reset-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }

        .password-input-wrapper {
            position: relative;
        }

        .form-group input[type="password"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #b388ff;
            box-shadow: 0 0 0 3px rgba(179, 136, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            padding: 4px 8px;
            transition: color 0.3s;
            border-radius: 6px;
        }

        .toggle-password:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .password-strength .bar {
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 4px;
            overflow: hidden;
        }

        .password-strength .bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b388ff, #7c4dff);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(179, 136, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateY(-2px);
        }

        .message {
            padding: 14px 16px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.12);
            border: 1px solid rgba(40, 167, 69, 0.25);
            color: #28a745;
            display: block;
        }

        .message.error {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.25);
            color: #ff6b6b;
            display: block;
        }

        .message.info {
            background: rgba(23, 162, 184, 0.12);
            border: 1px solid rgba(23, 162, 184, 0.25);
            color: #17a2b8;
            display: block;
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer-links a {
            color: #b388ff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .reset-box {
                padding: 28px 20px;
            }
            .reset-box h2 {
                font-size: 20px;
            }
            .form-group input {
                padding: 10px 14px;
                font-size: 14px;
            }
            .btn-primary {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ANIMATED BACKGROUND BUBBLES -->
    <div class="bubble-bg">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="reset-container">
        <div class="reset-box">
            <div class="logo">
                <a href="index.html">Mbare Marketplace</a>
            </div>

            <h2>Create New Password</h2>
            <p class="subtitle" id="statusMessage">Enter your new password below.</p>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">Show</button>
                    </div>
                    <div class="password-strength">
                        <div class="bar"><div class="fill" id="strengthBar"></div></div>
                        <span id="strengthText">Enter a password</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required minlength="6" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="resetBtn">Update Password</button>
            </form>

            <div id="messageBox" class="message"></div>

            <div class="footer-links">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // RESET PASSWORD - SUPABASE INTEGRATION
        // ============================================

        const SUPABASE_URL = 'https://fnncerdxfhwlrdopswpx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK';

        const form = document.getElementById('resetPasswordForm');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');
        const statusMessage = document.getElementById('statusMessage');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        let isAuthenticated = false;

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = 'message ' + type;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<span class="spinner"></span> Updating...';
            } else {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Update Password';
            }
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                document.querySelector(`#${inputId}`).parentElement.querySelector('.toggle-password').textContent = 'Hide';
            } else {
                input.type = 'password';
                document.querySelector(`#${inputId}`).parentElement.querySelector('.toggle-password').textContent = 'Show';
            }
        }

        function checkPasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) score++;
            if (password.match(/\d/)) score++;
            if (password.match(/[^a-zA-Z\d]/)) score++;

            const percentages = { 0: 0, 1: 25, 2: 50, 3: 75, 4: 100 };
            const colors = { 0: '#dc3545', 1: '#dc3545', 2: '#ffc107', 3: '#28a745', 4: '#28a745' };
            const labels = { 0: 'Weak', 1: 'Weak', 2: 'Medium', 3: 'Strong', 4: 'Very Strong' };

            const width = percentages[score] || 0;
            const color = colors[score] || '#dc3545';
            const label = labels[score] || 'Weak';

            strengthBar.style.width = width + '%';
            strengthBar.style.background = color;
            strengthText.textContent = label;

            return { score, width, color, label };
        }

        newPasswordInput.addEventListener('input', function() {
            const password = this.value;
            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Enter a password';
                return;
            }
            checkPasswordStrength(password);
        });

        async function checkSession() {
            try {
                const hash = window.location.hash;
                if (hash && hash.includes('access_token')) {
                    const params = new URLSearchParams(hash.substring(1));
                    const accessToken = params.get('access_token');

                    if (accessToken) {
                        const userResponse = await fetch(SUPABASE_URL + '/auth/v1/user', {
                            method: 'GET',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + accessToken
                            }
                        });

                        if (userResponse.ok) {
                            isAuthenticated = true;
                            statusMessage.textContent = 'Authenticated. You can now reset your password.';
                            statusMessage.style.color = '#28a745';
                            return true;
                        }
                    }
                }

                isAuthenticated = false;
                statusMessage.textContent = 'Reset link expired or invalid. Please request a new one.';
                statusMessage.style.color = '#ff6b6b';
                form.style.display = 'none';
                showMessage(
                    'The password reset link may have expired or been used. Please request a new one.',
                    'error'
                );
                return false;

            } catch (error) {
                console.error('Session check error:', error);
                isAuthenticated = false;
                statusMessage.textContent = 'Error verifying your reset link.';
                statusMessage.style.color = '#ff6b6b';
                return false;
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            hideMessage();
            setLoading(true);

            try {
                let accessToken = null;
                const hash = window.location.hash;
                if (hash && hash.includes('access_token')) {
                    const params = new URLSearchParams(hash.substring(1));
                    accessToken = params.get('access_token');
                }

                if (!accessToken) {
                    showMessage('Authentication required. Please request a new reset link.', 'error');
                    setLoading(false);
                    return;
                }

                const response = await fetch(SUPABASE_URL + '/auth/v1/user', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + accessToken
                    },
                    body: JSON.stringify({
                        password: newPassword
                    })
                });

                if (response.ok) {
                    showMessage(
                        'Password updated successfully! You can now login with your new password.',
                        'success'
                    );
                    form.style.display = 'none';
                    statusMessage.textContent = 'Password reset complete!';
                    statusMessage.style.color = '#28a745';

                    localStorage.removeItem('supabase_session');

                } else {
                    const error = await response.json();
                    console.error('Update error:', error);

                    if (error.message && error.message.includes('expired')) {
                        showMessage(
                            'The reset link has expired. Please request a new one.',
                            'error'
                        );
                    } else {
                        showMessage('Failed to update password: ' + (error.message || 'Unknown error'), 'error');
                    }
                }

            } catch (error) {
                console.error('Reset error:', error);
                showMessage('Network error. Please check your connection and try again.', 'error');
            } finally {
                setLoading(false);
            }
        });

        // Check session on page load
        document.addEventListener('DOMContentLoaded', checkSession);

        // Also check when hash changes
        window.addEventListener('hashchange', function() {
            if (!isAuthenticated) {
                checkSession();
            }
        });
    </script>

</body>
</html>
