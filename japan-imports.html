<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Japanese Import Cars | Mbare Marketplace</title>
    <meta name="description" content="Direct Japanese import stock from Be Forward available on order at Mbare Marketplace.">
    
    <link rel="canonical" href="https://www.mbaremarketplace.com/japan-imports.html">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .category-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        .category-header h1 {
            font-size: 22px;
            margin: 0;
        }
        
        .category-header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* --- VEHICLE SOURCE NAVIGATION --- */
        .vehicle-tabs-container {
            background: #1a2533;
            padding: 12px 0;
            border-bottom: 2px solid #232f3e;
        }

        .vehicle-tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: white;
        }

        .tab-btn.active {
            background: #f90;
            color: #1a2533;
            border-color: #f90;
            box-shadow: 0 2px 10px rgba(255, 153, 0, 0.4);
        }

        .filter-bar {
            background: white;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .filter-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .category-breadcrumb { padding: 12px 0; background: #f8f9fa; font-size: 14px; }
        .category-breadcrumb a { color: #232f3e; text-decoration: none; }
        .category-breadcrumb a:hover { color: #f90; }

        /* --- PRODUCT CARD STYLES --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding: 25px 0;
        }

        .product-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 5;
            color: white;
            background: #007bff;
        }

        .product-card-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .product-card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-card-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }

        .product-specs {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .spec-item {
            background: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .product-card-price {
            font-size: 18px;
            font-weight: 700;
            color: #232f3e;
            margin-top: auto;
            margin-bottom: 12px;
        }

        .btn-enquire {
            width: 100%;
            padding: 10px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-enquire:hover {
            background: #20ba5a;
        }

        /* --- MODAL STYLES --- */
        .contact-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow-y: auto;
            padding: 20px 0;
        }
        .contact-modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            position: relative;
            animation: slideDown 0.3s ease-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        @keyframes slideDown {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .close-contact-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
        }
        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .info-icon {
            width: 40px;
            height: 40px;
            background: #232f3e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: bold;
        }
        .info-text { flex: 1; min-width: 0; }
        .info-label { font-size: 12px; color: #666; margin-bottom: 3px; }
        .info-value { font-size: 16px; font-weight: 500; color: #232f3e; }
        .contact-actions { display: flex; gap: 10px; margin-top: 20px; }
        .contact-btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            color: white;
        }
        .whatsapp-btn { background: #25D366; }

        .header-top .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .category-header h1 { font-size: 18px; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .tab-btn { flex: 1; padding: 8px 10px; font-size: 12px; justify-content: center; }
        }
    </style>
</head>
<body data-category="japan-imports">

    <div id="sellerContactModal" class="contact-modal">
        <div class="contact-modal-content">
            <span class="close-contact-modal" onclick="document.getElementById('sellerContactModal').style.display='none'">&times;</span>
            <div id="sellerContactContent"></div>
        </div>
    </div>

    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo"><a href="index.html">Mbare Marketplace</a></div>
                <div class="search-bar">
                    <select class="search-category" id="searchCategory">
                        <option>All</option>
                        <option selected>Japan Direct Imports</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search Japanese stock..." class="search-input" onkeyup="handleImportSearch()">
                    <button class="search-btn" onclick="handleImportSearch()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                    </button>
                </div>
                <div class="header-right">
                    <div class="account-menu" id="accountMenu">
                        <span class="account-label">Hello, Sign in</span>
                        <a href="login.html" class="account-link">Account & Lists</a>
                        <button id="logoutBtn" class="logout-btn" onclick="logout()" style="display: none;">Logout</button>
                    </div>
                    <a href="Basket.html" class="basket">
                        <div class="basket-icon">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <path d="M16 10a4 4 0 0 1-8 0"></path>
                            </svg>
                            <span class="basket-count" id="basketCount">0</span>
                        </div>
                        <span class="basket-text">Basket</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="category-breadcrumb">
        <div class="container"><a href="index.html">Home</a> &gt; <a href="category-vehicles.html">Vehicles</a> &gt; <span>Japan Import Stock</span></div>
    </div>

    <section class="category-header">
        <div class="container">
            <h1>Direct Japan Imports (Be Forward Stock)</h1>
            <p>Order quality vehicles directly from Japanese stocklists with full delivery support</p>
        </div>
    </section>

    <!-- VEHICLE TAB NAVIGATION -->
    <div class="vehicle-tabs-container">
        <div class="container">
            <div class="vehicle-tabs">
                <a href="category-vehicles.html" class="tab-btn" id="tabLocal">
                    Local Stock
                </a>
                <a href="japan-imports.html" class="tab-btn active" id="tabImport">
                    Import on Order (Japan)
                </a>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="container">
            <div class="results-count" id="resultsCount">Loading scraped stock...</div>
            <select id="sortSelect" class="sort-select" onchange="sortProducts()">
                <option value="newest">Newest First</option>
                <option value="price_low">Price: Low to High</option>
                <option value="price_high">Price: High to Low</option>
            </select>
        </div>
    </div>

    <main class="main-content">
        <div class="container">
            <div class="product-grid" id="vehiclesGrid"></div>
        </div>
    </main>

    <!-- GLOBAL CORE SCRIPTS -->
    <script src="api.js"></script>
    <script src="auth-check.js"></script>

    <!-- JAPAN IMPORT VEHICLE ENGINE -->
    <script>
        let allImportVehicles = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchScrapedVehicles();
        });

        // Pulls 100+ scraped vehicles from Supabase database
        async function fetchScrapedVehicles() {
            const grid = document.getElementById('vehiclesGrid');
            const countLabel = document.getElementById('resultsCount');
            if (!grid) return;

            grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#666;">Loading 100+ Japanese import listings...</div>';

            try {
                // If using Supabase directly in JS:
                if (typeof supabase !== 'undefined') {
                    const { data, error } = await supabase
                        .from('vehicles')
                        .select('*')
                        .eq('listing_source', 'import_japan')
                        .order('created_at', { ascending: false });

                    if (!error && data && data.length > 0) {
                        allImportVehicles = data;
                        renderVehicles(allImportVehicles);
                        if (countLabel) countLabel.textContent = `Showing ${allImportVehicles.length} Japanese Import Vehicles`;
                        return;
                    }
                }
            } catch (err) {
                console.log('Supabase fetch failed, displaying fallback mock scraped stock:', err);
            }

            // Mock backup stock if database connection is pending
            allImportVehicles = [
                {
                    id: '1',
                    title: '2015 Honda Fit Hybrid (GP5)',
                    price_usd: 3400,
                    year: 2015,
                    mileage: '68,000 km',
                    transmission: 'Automatic',
                    main_image: 'https://bf-images.beforward.jp/stock/202402/3120141/BG3120141_1_800.jpg',
                    external_url: 'https://www.beforward.jp'
                },
                {
                    id: '2',
                    title: '2014 Toyota Passo 1.0X',
                    price_usd: 2150,
                    year: 2014,
                    mileage: '54,000 km',
                    transmission: 'Automatic',
                    main_image: 'https://bf-images.beforward.jp/stock/202402/3120142/BG3120142_1_800.jpg',
                    external_url: 'https://www.beforward.jp'
                },
                {
                    id: '3',
                    title: '2016 Mazda Demio 1.3 Skyactiv',
                    price_usd: 2800,
                    year: 2016,
                    mileage: '72,000 km',
                    transmission: 'Automatic',
                    main_image: 'https://bf-images.beforward.jp/stock/202402/3120143/BG3120143_1_800.jpg',
                    external_url: 'https://www.beforward.jp'
                }
            ];

            renderVehicles(allImportVehicles);
            if (countLabel) countLabel.textContent = `Showing ${allImportVehicles.length} Japanese Import Vehicles`;
        }

        function renderVehicles(vehicles) {
            const grid = document.getElementById('vehiclesGrid');
            if (!grid) return;
            
            grid.innerHTML = '';

            if (vehicles.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#666;">No import vehicles found.</div>';
                return;
            }

            vehicles.forEach(vehicle => {
                const cardHtml = `
                    <div class="product-card">
                        <span class="product-badge">Import Order</span>
                        <img src="${vehicle.main_image}" alt="${vehicle.title}" class="product-card-img" onerror="this.src='vehicles/1.jpg';">
                        
                        <div class="product-card-body">
                            <h3 class="product-card-title">${vehicle.title}</h3>
                            
                            <div class="product-specs">
                                <span class="spec-item">${vehicle.year}</span>
                                <span class="spec-item">${vehicle.mileage}</span>
                                <span class="spec-item">${vehicle.transmission}</span>
                            </div>

                            <div class="product-card-price">$${vehicle.price_usd.toLocaleString()} <span style="font-size:11px; font-weight:normal; color:#666;">FOB/Est</span></div>

                            <button class="btn-enquire" onclick="openContactModal('${vehicle.title}', '${vehicle.price_usd}', '${vehicle.external_url || ''}')">
                                Enquire on WhatsApp
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // Live Search Handling with Lowercase Normalized Keyword URL
        function handleImportSearch() {
            const rawQuery = document.getElementById('searchInput')?.value || '';
            const cleanKeyword = rawQuery.trim().toLowerCase();
            const countLabel = document.getElementById('resultsCount');

            if (!cleanKeyword) {
                renderVehicles(allImportVehicles);
                if (countLabel) countLabel.textContent = `Showing ${allImportVehicles.length} Japanese Import Vehicles`;
                return;
            }

            const matchedVehicles = allImportVehicles.filter(vehicle => 
                vehicle.title.toLowerCase().includes(cleanKeyword)
            );

            if (matchedVehicles.length > 0) {
                renderVehicles(matchedVehicles);
                if (countLabel) {
                    countLabel.textContent = `Found ${matchedVehicles.length} scraped results for "${cleanKeyword}"`;
                }
            } else {
                // Lowercase formatted keyword URL
                const formattedKeyword = encodeURIComponent(cleanKeyword);
                const liveSearchUrl = `https://www.beforward.jp/stocklist/keyword=${formattedKeyword}`;
                const whatsappMsg = encodeURIComponent(`Hi Mbare Marketplace, I am looking to import a ${cleanKeyword}. Do you have this stock available?`);

                const grid = document.getElementById('vehiclesGrid');
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px 16px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px;">
                        <h3 style="font-size: 1.1rem; color: #1e293b; margin-bottom: 8px;">
                            No matching vehicles in our scraped database for "${cleanKeyword}"
                        </h3>
                        <p style="color: #64748b; margin-bottom: 20px; font-size: 14px;">
                            You can order this model directly or browse live stock on Be Forward using the link below:
                        </p>
                        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                            <a 
                                href="https://wa.me/263770000000?text=${whatsappMsg}" 
                                target="_blank" 
                                style="padding: 10px 20px; background: #25D366; color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px;"
                            >
                                Order "${cleanKeyword}" via WhatsApp
                            </a>
                            <a 
                                href="${liveSearchUrl}" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                style="padding: 10px 20px; background: #0284c7; color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px;"
                            >
                                Search Live Be Forward Stock for "${cleanKeyword}"
                            </a>
                        </div>
                    </div>
                `;
            }
        }

        function openContactModal(title, price, externalUrl) {
            const modal = document.getElementById('sellerContactModal');
            const content = document.getElementById('sellerContactContent');
            
            const adminPhone = "263770000000";
            const message = encodeURIComponent(`Hi Mbare Marketplace, I am interested in ordering the ${title} priced at $${price} USD (Import Stock). Is it available? Link: ${externalUrl}`);
            
            content.innerHTML = `
                <div class="product-title" style="font-weight:700; font-size:16px; margin-bottom:15px;">${title}</div>
                <div class="info-row">
                    <div class="info-icon">$</div>
                    <div class="info-text">
                        <div class="info-label">Estimated Price</div>
                        <div class="info-value">$${Number(price).toLocaleString()} USD</div>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon">Type</div>
                    <div class="info-text">
                        <div class="info-label">Stock Source</div>
                        <div class="info-value">Japan Direct Import (Be Forward)</div>
                    </div>
                </div>
                <div class="contact-actions">
                    <a href="https://wa.me/${adminPhone}?text=${message}" target="_blank" class="contact-btn whatsapp-btn">Continue to WhatsApp</a>
                </div>
            `;
            
            modal.style.display = 'block';
        }

        function sortProducts() {
            const val = document.getElementById('sortSelect').value;
            if (val === 'price_low') {
                allImportVehicles.sort((a, b) => a.price_usd - b.price_usd);
            } else if (val === 'price_high') {
                allImportVehicles.sort((a, b) => b.price_usd - a.price_usd);
            }
            renderVehicles(allImportVehicles);
        }
    </script>
</body>
</html>
