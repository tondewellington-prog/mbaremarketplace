<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Imports Search | Mbare Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .japan-search-box {
            background: #1a2533;
            color: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
        }
        .search-form {
            display: flex;
            max-width: 600px;
            margin: 15px auto 0 auto;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        .search-btn {
            background: #f90;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .search-btn:hover { background: #e08800; }
        .search-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f1f5f9;
        }
        .product-card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a2533;
        }
        .product-details {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #28a745;
            margin-bottom: 12px;
        }
        .view-btn {
            margin-top: auto;
            display: block;
            text-align: center;
            background: #232f3e;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .view-btn:hover { background: #f90; }
        .error-msg {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 6px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Live Vehicle Search Bar -->
        <div class="japan-search-box">
            <h2>Search Japanese Vehicles</h2>
            <p>Search Be Forward stock directly from our database, or query live stock automatically.</p>
            <form class="search-form" onsubmit="handleLiveSearch(event)">
                <input 
                    type="text" 
                    id="searchQueryInput" 
                    class="search-input" 
                    placeholder="Search vehicle model (e.g., Fit, Dualis, Demio)..." 
                    required
                >
                <button type="submit" id="searchSubmitBtn" class="search-btn">Search Stock</button>
            </form>
            <div id="searchStatus" style="margin-top: 12px; font-size: 14px;"></div>
        </div>

        <h2>Available Imports</h2>
        <div class="product-grid" id="vehiclesGrid">
            <p>Loading Be Forward stock...</p>
        </div>
    </div>

    <!-- Supabase SDK & API config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>

    <script>
        function resolveSupabaseClient() {
            if (typeof window.supabaseClient !== 'undefined') {
                return window.supabaseClient;
            }
            if (typeof supabaseClient !== 'undefined') {
                return supabaseClient;
            }
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            if (typeof window.supabase !== 'undefined' && typeof window.SUPABASE_URL !== 'undefined' && typeof window.SUPABASE_ANON_KEY !== 'undefined') {
                return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
            }
            return null;
        }

        function waitForSupabase() {
            return new Promise((resolve, reject) => {
                let client = resolveSupabaseClient();
                if (client) {
                    return resolve(client);
                }
                let attempts = 0;
                const interval = setInterval(() => {
                    attempts++;
                    client = resolveSupabaseClient();
                    if (client) {
                        clearInterval(interval);
                        resolve(client);
                    } else if (attempts >= 30) {
                        clearInterval(interval);
                        reject(new Error('No Supabase client instance found. Check variable declarations in api.js.'));
                    }
                }, 100);
            });
        }

        // Load existing database stock on page load
        async function fetchScrapedVehicles() {
            const grid = document.getElementById('vehiclesGrid');

            try {
                const client = await waitForSupabase();

                const { data: vehicles, error } = await client
                    .from('vehicles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!vehicles || vehicles.length === 0) {
                    grid.innerHTML = '<p>No Japanese imports found in database.</p>';
                    return;
                }

                renderVehicles(vehicles);
            } catch (err) {
                console.error('Error fetching stored cars:', err);
                grid.innerHTML = `
                    <div class="error-msg">
                        <strong>Database Error:</strong> ${err.message || err.details || JSON.stringify(err)}
                    </div>
                `;
            }
        }

        function renderVehicles(vehicles) {
            const grid = document.getElementById('vehiclesGrid');
            grid.innerHTML = vehicles.map(vehicle => {
                const year = vehicle.year ? `Year: ${vehicle.year}` : '';
                const trans = vehicle.transmission ? `Trans: ${vehicle.transmission}` : '';
                const mileage = vehicle.mileage ? `Mileage: ${vehicle.mileage}` : '';
                const details = [year, trans, mileage].filter(Boolean).join(' | ');

                const formattedPrice = vehicle.price_usd 
                    ? `$${Number(vehicle.price_usd).toLocaleString()} USD` 
                    : 'Price on Request';

                const imageSrc = vehicle.main_image || 'https://via.placeholder.com/300x180?text=No+Image';

                return `
                    <div class="product-card">
                        <img 
                            src="${imageSrc}" 
                            alt="${vehicle.title}"
                        >
                        <div class="product-card-body">
                            <div class="product-title">${vehicle.title}</div>
                            ${details ? `<div class="product-details">${details}</div>` : ''}
                            <div class="product-price">${formattedPrice}</div>
                            ${vehicle.external_url ? `<a href="${vehicle.external_url}" target="_blank" class="view-btn">View Details →</a>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Live Search Handler with JSON validation
        async function handleLiveSearch(event) {
            event.preventDefault();
            const input = document.getElementById('searchQueryInput');
            const btn = document.getElementById('searchSubmitBtn');
            const status = document.getElementById('searchStatus');
            const query = input.value.trim();

            if (!query) return;

            status.style.color = '#fff';
            status.innerText = `Searching stock for "${query}"...`;
            btn.disabled = true;

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Server returned HTML instead of JSON (Status ${response.status}). Check backend API path or server logs.`);
                }

                const result = await response.json();

                if (result.success && result.vehicles && result.vehicles.length > 0) {
                    status.style.color = '#28a745';
                    const originText = result.source === 'database' ? 'Database Stock' : 'Live Be Forward Search';
                    status.innerText = `Found ${result.vehicles.length} vehicles via ${originText}!`;
                    renderVehicles(result.vehicles);
                } else if (result.success && (!result.vehicles || result.vehicles.length === 0)) {
                    status.style.color = '#f90';
                    status.innerText = `No stock matched "${query}". Try searching for popular models like "Fit", "Dualis", or "Demio".`;
                } else {
                    status.style.color = '#ff6b6b';
                    status.innerText = 'Error: ' + (result.error || 'Failed to search stock.');
                }
            } catch (err) {
                console.error('Search request error:', err);
                status.style.color = '#ff6b6b';
                status.innerText = 'Server connection failed: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchScrapedVehicles);
    </script>
</body>
</html>
