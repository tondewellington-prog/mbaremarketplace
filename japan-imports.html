<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Imports - Mbare Marketplace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #0f172a;
      --accent-color: #16a34a;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .car-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-image-container {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #f1f5f9;
      overflow: hidden;
    }

    .card-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-source {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: capitalize;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      min-height: 2.75rem;
    }

    .specs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .specs-row span {
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .price-tag {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: auto;
      margin-bottom: 1rem;
    }

    .btn-listing {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-listing:hover {
      background-color: #0f172a;
    }

    .status-msg {
      grid-column: 1 / -1;
      padding: 1.5rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
    }

    .status-msg.error {
      color: #991b1b;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
    }

    .status-msg.info {
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Available Imports</h1>
      <p>Browse live vehicle listings updated directly from our import feeds.</p>
    </div>

    <div id="cars-container" class="cars-grid">
      <div class="status-msg info">Loading vehicles from database...</div>
    </div>
  </div>

  <script>
    // Replace with your actual Supabase Project details
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const TABLE_NAME = 'cars'; // Change if your Supabase table has a different name

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadCars() {
      const container = document.getElementById('cars-container');

      try {
        const { data: cars, error } = await supabaseClient
          .from(TABLE_NAME)
          .select('id, title, price_usd, listing_source, year, mileage, transmission, main_image, external_url, created_at')
          .order('created_at', { ascending: false });

        if (error) {
          throw error;
        }

        if (!cars || cars.length === 0) {
          container.innerHTML = `<div class="status-msg info">No vehicles found in table "${TABLE_NAME}".</div>`;
          return;
        }

        container.innerHTML = '';

        cars.forEach(car => {
          let priceText = 'Contact for Price';
          if (car.price_usd !== null && car.price_usd !== undefined && car.price_usd !== '') {
            const num = Number(car.price_usd);
            priceText = !isNaN(num) ? '$' + num.toLocaleString() : '$' + car.price_usd;
          }

          const card = document.createElement('div');
          card.className = 'car-card';

          card.innerHTML = `
            <div class="card-image-container">
              ${car.main_image ? `<img src="${car.main_image}" alt="${car.title || 'Vehicle'}" />` : ''}
              ${car.listing_source ? `<span class="badge-source">${car.listing_source}</span>` : ''}
            </div>
            <div class="card-body">
              <h2 class="card-title">${car.title || 'Import Vehicle'}</h2>
              <div class="specs-row">
                ${car.year ? `<span>Year: ${car.year}</span>` : ''}
                ${car.transmission ? `<span>${car.transmission}</span>` : ''}
                ${car.mileage ? `<span>${car.mileage}</span>` : ''}
              </div>
              <div class="price-tag">${priceText}</div>
              <a href="${car.external_url || '#'}" class="btn-listing" target="_blank" rel="noopener noreferrer">
                View Original Listing
              </a>
            </div>
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error('Supabase Error:', err);
        container.innerHTML = `
          <div class="status-msg error">
            <strong>Error loading data:</strong> ${err.message || JSON.stringify(err)}
            <br><br>
            Please check:
            1. Your SUPABASE_URL and SUPABASE_ANON_KEY credentials.
            2. That table "${TABLE_NAME}" exists in Supabase.
            3. That Row Level Security (RLS) policies allow SELECT queries on the table.
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadCars);
  </script>
</body>
</html>
