<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Imports Search | Mbare Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .japan-search-box {
            background: #1a2533;
            color: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 8px;
            text-align: center;
        }
        .search-form {
            display: flex;
            max-width: 600px;
            margin: 15px auto 0 auto;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        .search-btn {
            background: #f90;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .search-btn:hover { background: #e08800; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #f1f5f9;
        }
        .product-card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a2533;
        }
        .product-details {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #28a745;
            margin-bottom: 12px;
        }
        .view-btn {
            margin-top: auto;
            display: block;
            text-align: center;
            background: #232f3e;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .view-btn:hover { background: #f90; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Live Vehicle Search Bar -->
        <div class="japan-search-box">
            <h2>Search Japanese Vehicles</h2>
            <p>Type a car name (e.g., <em>Toyota Fit, Nissan Dualis, Demio</em>) to fetch live stock directly into our database.</p>
            <form class="search-form" onsubmit="handleLiveSearch(event)">
                <input 
                    type="text" 
                    id="searchQueryInput" 
                    class="search-input" 
                    placeholder="Search vehicle model..." 
                    required
                >
                <button type="submit" id="searchSubmitBtn" class="search-btn">Search Stock</button>
            </form>
            <div id="searchStatus" style="margin-top: 12px; font-size: 14px;"></div>
        </div>

        <h2>Available Imports</h2>
        <div class="product-grid" id="vehiclesGrid">
            <p>Loading database stock...</p>
        </div>
    </div>

    <!-- Supabase SDK & API config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>

    <script>
        const FALLBACK_IMG = 'https://placehold.co/400x250?text=No+Image+Available';

        function sanitizeUrl(url) {
            if (!url) return FALLBACK_IMG;
            return url.replace('bf-images.beforward.jp', 'cdn.beforward.jp');
        }

        // Load existing database stock on page load
        async function fetchScrapedVehicles() {
            const grid = document.getElementById('vehiclesGrid');
            try {
                const { data: vehicles, error } = await window.supabaseClient
                    .from('vehicles')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!vehicles || vehicles.length === 0) {
                    grid.innerHTML = '<p>No Japanese imports found. Use the search bar above to fetch vehicles live!</p>';
                    return;
                }

                renderVehicles(vehicles);
            } catch (err) {
                console.error('Error fetching stored cars:', err);
                grid.innerHTML = '<p style="color: red;">Failed to connect to database. Make sure Row Level Security (RLS) allows select queries.</p>';
            }
        }

        function renderVehicles(vehicles) {
            const grid = document.getElementById('vehiclesGrid');
            grid.innerHTML = vehicles.map(vehicle => {
                const img = sanitizeUrl(vehicle.main_image);
                
                let formattedPrice = 'Contact for Price';
                if (vehicle.price_usd !== null && vehicle.price_usd !== undefined && vehicle.price_usd !== '') {
                    const num = Number(vehicle.price_usd);
                    formattedPrice = !isNaN(num) ? '$' + num.toLocaleString() : '$' + vehicle.price_usd;
                }

                const year = vehicle.year ? `Year: ${vehicle.year}` : '';
                const trans = vehicle.transmission ? `${vehicle.transmission}` : '';
                const mileage = vehicle.mileage ? `${vehicle.mileage}` : '';
                const details = [year, trans, mileage].filter(Boolean).join(' | ');

                return `
                    <div class="product-card">
                        <img 
                            src="${img}" 
                            alt="${vehicle.title || 'Japanese Import'}"
                            onerror="this.onerror=null; this.src='${FALLBACK_IMG}';"
                        >
                        <div class="product-card-body">
                            <div class="product-title">${vehicle.title || 'Japanese Vehicle'}</div>
                            ${details ? `<div class="product-details">${details}</div>` : ''}
                            <div class="product-price">${formattedPrice}</div>
                            <a href="${vehicle.external_url || '#'}" target="_blank" class="view-btn">View Original Listing</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Live Search Handler
        async function handleLiveSearch(event) {
            event.preventDefault();
            const input = document.getElementById('searchQueryInput');
            const btn = document.getElementById('searchSubmitBtn');
            const status = document.getElementById('searchStatus');
            const keyword = input.value.trim();

            status.style.color = '#fff';
            status.innerText = `Searching live Japanese inventory for "${keyword}"...`;
            btn.disabled = true;

            try {
                const response = await fetch('/api/search-and-scrape-japan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword })
                });

                const result = await response.json();

                if (result.success && result.vehicles.length > 0) {
                    status.style.color = '#28a745';
                    status.innerText = `Found ${result.count} vehicles! Saved to database and updated below.`;
                    renderVehicles(result.vehicles);
                } else if (result.success && result.vehicles.length === 0) {
                    status.style.color = '#f90';
                    status.innerText = `No stock matched "${keyword}". Try a broader term like "Toyota" or "Nissan".`;
                } else {
                    status.style.color = '#ff6b6b';
                    status.innerText = 'Error: ' + (result.error || 'Failed to retrieve stock.');
                }
            } catch (err) {
                console.error('Search request error:', err);
                status.style.color = '#ff6b6b';
                status.innerText = 'Server connection failed.';
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchScrapedVehicles);
    </script>
</body>
</html>
