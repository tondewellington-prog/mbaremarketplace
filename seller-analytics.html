<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Seller Analytics - Mbare Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #EAEDED;
            min-height: 100vh;
        }
        .header {
            background-color: #131921;
            color: white;
        }
        .header-top .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo a {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu {
            background: #232f3e;
            padding: 8px 0;
        }
        .nav-menu .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .nav-item {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f1724 100%);
            color: white;
            padding: 28px;
            border-radius: 24px;
            margin: 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .page-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .page-header p {
            margin-top: 6px;
            opacity: 0.85;
        }
        .btn-back {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.25);
        }
        .btn-primary {
            background: #FFD814;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #111;
            transition: 0.2s;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 24px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .stat-number {
            font-size: 38px;
            font-weight: 800;
            color: #B12704;
        }
        .stat-label {
            color: #4b5563;
            margin-top: 8px;
            font-weight: 500;
        }
        .section {
            background: white;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
        }
        .section h2 {
            margin-bottom: 20px;
            color: #232f3e;
            border-left: 4px solid #f90;
            padding-left: 16px;
            font-size: 1.3rem;
        }
        .two-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 28px;
            margin-bottom: 28px;
        }
        .product-list {
            list-style: none;
        }
        .product-list li {
            padding: 14px 0;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            background: #dc3545;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-warning {
            background: #f90;
        }
        .badge-success {
            background: #28a745;
        }
        .chart-container {
            max-width: 100%;
            height: 280px;
            position: relative;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .upgrade-message {
            text-align: center;
            padding: 60px 30px;
            background: white;
            border-radius: 24px;
        }
        .footer {
            margin-top: 50px;
            background: #232f3e;
            color: white;
        }
        .footer-bottom {
            background: #131921;
            text-align: center;
            padding: 18px;
            font-size: 0.8rem;
        }
        .date-filter {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-filter select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }
        .insight-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
        }
        .insight-title {
            font-weight: 600;
            color: #232f3e;
            margin-bottom: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                gap: 12px;
            }
            .stat-number {
                font-size: 28px;
            }
            .section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo"><a href="index.html">Mbare Marketplace</a></div>
                <div class="header-right">
                    <span class="nav-item">Seller Analytics</span>
                </div>
            </div>
        </div>
        <nav class="nav-menu">
            <div class="container">
                <a href="seller-dashboard.html" class="nav-item">Dashboard</a>
                <a href="index.html" class="nav-item">Home</a>
                <a href="#" class="nav-item">Support</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Seller Analytics</h1>
                <p>Track your product views, inquiries, and performance</p>
            </div>
            <button class="btn-back" onclick="window.location.href='seller-dashboard.html'">Back to Dashboard</button>
        </div>

        <div id="analyticsContent">
            <div class="loading">Loading analytics data...</div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom"><div class="container">© 2026 Mbare Marketplace</div></div>
    </footer>

        <script src="js/pages/seller-analytics.js"></script>
</body>
</html>
