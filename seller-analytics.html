<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Seller Analytics - Mbare Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #EAEDED;
            min-height: 100vh;
        }
        .header {
            background-color: #131921;
            color: white;
        }
        .header-top .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo a {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu {
            background: #232f3e;
            padding: 8px 0;
        }
        .nav-menu .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .nav-item {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f1724 100%);
            color: white;
            padding: 28px;
            border-radius: 24px;
            margin: 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .page-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .page-header p {
            margin-top: 6px;
            opacity: 0.85;
        }
        .btn-back {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.25);
        }
        .btn-primary {
            background: #FFD814;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #111;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #F7CA00;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 24px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .stat-number {
            font-size: 38px;
            font-weight: 800;
            color: #B12704;
        }
        .stat-label {
            color: #4b5563;
            margin-top: 8px;
            font-weight: 500;
        }
        .section {
            background: white;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
        }
        .section h2 {
            margin-bottom: 20px;
            color: #232f3e;
            border-left: 4px solid #f90;
            padding-left: 16px;
        }
        .product-list {
            list-style: none;
        }
        .product-list li {
            padding: 14px 0;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            background: #dc3545;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-warning {
            background: #f90;
        }
        .badge-success {
            background: #28a745;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eef2f6;
        }
        .category-name {
            font-weight: 500;
        }
        .category-count {
            background: #f3f4f6;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #B12704;
        }
        .subscription-info {
            background: #f0fdf4;
            border-radius: 16px;
            padding: 20px;
            margin-top: 10px;
            border-left: 4px solid #28a745;
        }
        .upgrade-message {
            text-align: center;
            padding: 50px 30px;
            background: white;
            border-radius: 24px;
        }
        .upgrade-message h2 {
            margin-bottom: 16px;
            color: #232f3e;
        }
        .upgrade-message p {
            margin-bottom: 24px;
            color: #4b5563;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .footer {
            margin-top: 50px;
            background: #232f3e;
            color: white;
        }
        .footer-bottom {
            background: #131921;
            text-align: center;
            padding: 18px;
            font-size: 0.8rem;
        }
        .two-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo"><a href="index.html">Mbare Marketplace</a></div>
                <div class="header-right">
                    <span class="nav-item">Hello, Seller</span>
                </div>
            </div>
        </div>
        <nav class="nav-menu">
            <div class="container">
                <a href="seller-dashboard.html" class="nav-item">Dashboard</a>
                <a href="#" class="nav-item">All</a>
                <a href="#" class="nav-item">Today's Deals</a>
                <a href="#" class="nav-item">Customer Service</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Seller Analytics</h1>
                <p>Your personal performance overview and insights</p>
            </div>
            <button class="btn-back" onclick="window.location.href='seller-dashboard.html'">← Back to Dashboard</button>
        </div>

        <div id="analyticsContent">
            <!-- Content will be loaded dynamically based on subscription status -->
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom"><div class="container">© 2026 Mbare Marketplace</div></div>
    </footer>

    <script>
        // Configuration
        let currentSellerId = "seller_mbare_001";
        let currentTier = "free";
        let sellerProducts = [];

        // Load data from localStorage
        function loadSellerData() {
            const savedTier = localStorage.getItem(`mbare_tier_${currentSellerId}`);
            if (savedTier && (savedTier === 'tier_150' || savedTier === 'tier_5')) {
                currentTier = savedTier;
            }
            
            const stored = localStorage.getItem(`mbare_products_${currentSellerId}`);
            sellerProducts = stored ? JSON.parse(stored) : [];
        }

        // Helper to escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
            });
        }

        // Get WhatsApp clicks for this seller
        function getWhatsAppClicks() {
            const allClicks = JSON.parse(localStorage.getItem('mbare_whatsapp_clicks') || '[]');
            return allClicks.filter(c => c.sellerId === currentSellerId).length;
        }

        // Get product clicks per product
        function getProductClicks() {
            const allClicks = JSON.parse(localStorage.getItem('mbare_whatsapp_clicks') || '[]');
            const sellerClicks = allClicks.filter(c => c.sellerId === currentSellerId);
            const productMap = {};
            sellerClicks.forEach(click => {
                const title = click.productTitle;
                if (title) productMap[title] = (productMap[title] || 0) + 1;
            });
            return productMap;
        }

        // Calculate category breakdown
        function getCategoryBreakdown() {
            const breakdown = {};
            sellerProducts.forEach(p => {
                const cat = p.category || 'Other';
                breakdown[cat] = (breakdown[cat] || 0) + 1;
            });
            return breakdown;
        }

        // Calculate total inventory value
        function getTotalInventoryValue() {
            return sellerProducts.reduce((sum, p) => sum + (p.price * (p.stock || 0)), 0);
        }

        // Calculate total stock
        function getTotalStock() {
            return sellerProducts.reduce((sum, p) => sum + (p.stock || 0), 0);
        }

        // Find low stock products (stock < 5)
        function getLowStockProducts() {
            return sellerProducts.filter(p => p.stock < 5 && p.stock > 0);
        }

        // Find out of stock products
        function getOutOfStockProducts() {
            return sellerProducts.filter(p => p.stock === 0);
        }

        // Get top products by WhatsApp inquiries
        function getTopProductsByInquiries() {
            const clicks = getProductClicks();
            return Object.entries(clicks)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
        }

        // Render the analytics page based on subscription status
        function renderAnalytics() {
            const container = document.getElementById('analyticsContent');
            
            if (currentTier === 'free') {
                // Free user - show upgrade message
                container.innerHTML = `
                    <div class="upgrade-message">
                        <h2>📊 Seller Analytics Unlocked</h2>
                        <p>Analytics and insights are available exclusively for paid subscribers.</p>
                        <div style="max-width: 400px; margin: 0 auto 25px auto; background: #f8f9fa; padding: 20px; border-radius: 16px;">
                            <h3 style="margin-bottom: 12px;">What you get with a paid plan:</h3>
                            <ul style="text-align: left; list-style: none; padding-left: 0;">
                                <li style="margin: 10px 0;">✓ Product performance tracking</li>
                                <li style="margin: 10px 0;">✓ Low stock and out of stock alerts</li>
                                <li style="margin: 10px 0;">✓ WhatsApp inquiry analytics</li>
                                <li style="margin: 10px 0;">✓ Category performance breakdown</li>
                                <li style="margin: 10px 0;">✓ Inventory value trends</li>
                                <li style="margin: 10px 0;">✓ Unlimited products (up to 200)</li>
                            </ul>
                        </div>
                        <button class="btn-primary" id="upgradeBtn">View Subscription Plans</button>
                    </div>
                `;
                document.getElementById('upgradeBtn').addEventListener('click', () => {
                    window.location.href = 'seller-dashboard.html';
                });
                return;
            }

            // Paid user - show full analytics
            const totalProducts = sellerProducts.length;
            const totalStock = getTotalStock();
            const totalValue = getTotalInventoryValue();
            const whatsappClicks = getWhatsAppClicks();
            const lowStock = getLowStockProducts();
            const outOfStock = getOutOfStockProducts();
            const categoryBreakdown = getCategoryBreakdown();
            const topProducts = getTopProductsByInquiries();
            const planName = currentTier === 'tier_150' ? 'Merchant Basic' : 'Video Ads Plan';
            const planPrice = currentTier === 'tier_150' ? '$1.50' : '$5.00';
            const productLimit = currentTier === 'tier_150' ? 50 : 200;
            const remainingSlots = productLimit - totalProducts;

            container.innerHTML = `
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${totalProducts}</div>
                        <div class="stat-label">Total Products</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${totalStock}</div>
                        <div class="stat-label">Items in Stock</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">$${totalValue.toFixed(2)}</div>
                        <div class="stat-label">Inventory Value</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${whatsappClicks}</div>
                        <div class="stat-label">WhatsApp Inquiries</div>
                    </div>
                </div>

                <!-- Two column layout -->
                <div class="two-columns">
                    <!-- Left Column -->
                    <div>
                        <!-- Low Stock Alerts -->
                        <div class="section">
                            <h2>⚠️ Low Stock Alerts</h2>
                            ${lowStock.length === 0 ? '<p class="empty-state">No low stock items. Good inventory management!</p>' : `
                                <ul class="product-list">
                                    ${lowStock.map(p => `
                                        <li>
                                            <span><strong>${escapeHtml(p.title)}</strong></span>
                                            <span class="badge badge-warning">Stock: ${p.stock}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            `}
                        </div>

                        <!-- Out of Stock -->
                        <div class="section">
                            <h2>🚫 Out of Stock Products</h2>
                            ${outOfStock.length === 0 ? '<p class="empty-state">All products are in stock.</p>' : `
                                <ul class="product-list">
                                    ${outOfStock.map(p => `
                                        <li>
                                            <span><strong>${escapeHtml(p.title)}</strong></span>
                                            <span class="badge">Out of Stock</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            `}
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div>
                        <!-- Products by Category -->
                        <div class="section">
                            <h2>📁 Products by Category</h2>
                            ${Object.keys(categoryBreakdown).length === 0 ? '<p class="empty-state">No products categorized yet.</p>' : `
                                ${Object.entries(categoryBreakdown).map(([cat, count]) => `
                                    <div class="category-item">
                                        <span class="category-name">${escapeHtml(cat)}</span>
                                        <span class="category-count">${count} product${count !== 1 ? 's' : ''}</span>
                                    </div>
                                `).join('')}
                            `}
                        </div>

                        <!-- Top Products by WhatsApp Inquiries -->
                        <div class="section">
                            <h2>📞 Top WhatsApp Inquiries</h2>
                            ${topProducts.length === 0 ? '<p class="empty-state">No WhatsApp inquiries yet. Share your products to get inquiries.</p>' : `
                                <ul class="product-list">
                                    ${topProducts.map(([title, count]) => `
                                        <li>
                                            <span><strong>${escapeHtml(title)}</strong></span>
                                            <span class="badge-success" style="background: #28a745; padding: 4px 12px; border-radius: 30px;">${count} inquiry${count !== 1 ? 's' : ''}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            `}
                        </div>
                    </div>
                </div>

                <!-- Subscription Info -->
                <div class="section">
                    <h2>💳 Your Subscription</h2>
                    <div class="subscription-info">
                        <p><strong>Current Plan:</strong> ${planName} (${planPrice}/month)</p>
                        <p><strong>Product Limit:</strong> ${productLimit} products</p>
                        <p><strong>Products Used:</strong> ${totalProducts} / ${productLimit} (${remainingSlots} slots remaining)</p>
                        <p><strong>Benefits:</strong> ${currentTier === 'tier_150' ? 'Priority support, up to 50 products' : 'Video ads on social platforms, up to 200 products, priority support'}</p>
                    </div>
                </div>

                <!-- All Products List -->
                <div class="section">
                    <h2>📦 All Products Overview</h2>
                    ${sellerProducts.length === 0 ? '<p class="empty-state">No products added yet. Start adding products to see them here.</p>' : `
                        <ul class="product-list">
                            ${sellerProducts.map(p => `
                                <li>
                                    <div>
                                        <strong>${escapeHtml(p.title)}</strong>
                                        <span style="color: #666; font-size: 13px; margin-left: 10px;">${escapeHtml(p.category || 'Uncategorized')}</span>
                                    </div>
                                    <div>
                                        <span style="margin-right: 15px;">💰 $${parseFloat(p.price).toFixed(2)}</span>
                                        <span style="margin-right: 15px;">📦 Stock: ${p.stock || 0}</span>
                                        <span>📞 ${getProductClicks()[p.title] || 0} inquiries</span>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    `}
                </div>
            `;
        }

        // Initialize
        loadSellerData();
        renderAnalytics();
    </script>
</body>
</html>
