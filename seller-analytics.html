<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Seller Analytics - Mbare Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #EAEDED;
            min-height: 100vh;
        }
        .header {
            background-color: #131921;
            color: white;
        }
        .header-top .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo a {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-menu {
            background: #232f3e;
            padding: 8px 0;
        }
        .nav-menu .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .nav-item {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            background: linear-gradient(135deg, #1e2a3a 0%, #0f1724 100%);
            color: white;
            padding: 28px;
            border-radius: 24px;
            margin: 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .page-header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .page-header p {
            margin-top: 6px;
            opacity: 0.85;
        }
        .btn-back {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.25);
        }
        .btn-primary {
            background: #FFD814;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #111;
            transition: 0.2s;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 24px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .stat-number {
            font-size: 38px;
            font-weight: 800;
            color: #B12704;
        }
        .stat-label {
            color: #4b5563;
            margin-top: 8px;
            font-weight: 500;
        }
        .section {
            background: white;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
        }
        .section h2 {
            margin-bottom: 20px;
            color: #232f3e;
            border-left: 4px solid #f90;
            padding-left: 16px;
        }
        .two-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 28px;
            margin-bottom: 28px;
        }
        .product-list {
            list-style: none;
        }
        .product-list li {
            padding: 14px 0;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            background: #dc3545;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-warning {
            background: #f90;
        }
        .badge-success {
            background: #28a745;
        }
        .chart-container {
            max-width: 100%;
            height: 300px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .upgrade-message {
            text-align: center;
            padding: 60px 30px;
            background: white;
            border-radius: 24px;
        }
        .footer {
            margin-top: 50px;
            background: #232f3e;
            color: white;
        }
        .footer-bottom {
            background: #131921;
            text-align: center;
            padding: 18px;
            font-size: 0.8rem;
        }
        .date-filter {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-filter input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo"><a href="index.html">Mbare Marketplace</a></div>
                <div class="header-right">
                    <span class="nav-item">Hello, Seller</span>
                </div>
            </div>
        </div>
        <nav class="nav-menu">
            <div class="container">
                <a href="seller-dashboard.html" class="nav-item">Dashboard</a>
                <a href="#" class="nav-item">All</a>
                <a href="#" class="nav-item">Today's Deals</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Seller Analytics</h1>
                <p>Track your product performance and customer engagement</p>
            </div>
            <button class="btn-back" onclick="window.location.href='seller-dashboard.html'">← Back to Dashboard</button>
        </div>

        <div id="analyticsContent">
            <div class="loading">Loading analytics data...</div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom"><div class="container">© 2026 Mbare Marketplace</div></div>
    </footer>

    <script>
        // Supabase configuration - UPDATE WITH YOUR VALUES
        const SUPABASE_URL = 'https://your-project.supabase.co';  // ← REPLACE
        const SUPABASE_ANON_KEY = 'your-anon-key';  // ← REPLACE
        
        let currentSellerId = "seller_mbare_001";
        let currentTier = "free";
        let chartViews = null;
        let chartClicks = null;

        // Get seller tier from localStorage
        function getSellerTier() {
            const savedTier = localStorage.getItem(`mbare_tier_${currentSellerId}`);
            if (savedTier && (savedTier === 'tier_150' || savedTier === 'tier_5')) {
                currentTier = savedTier;
                return true;
            }
            return false;
        }

        // Fetch product views from Supabase
        async function fetchProductViews(days = 30) {
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - days);
            
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/product_views?select=*&seller_id=eq.${currentSellerId}&viewed_at=gte.${startDate.toISOString()}&order=viewed_at.asc`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                return await response.json();
            } catch (error) {
                console.error('Error fetching product views:', error);
                return [];
            }
        }

        // Fetch WhatsApp clicks from Supabase
        async function fetchWhatsAppClicks(days = 30) {
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - days);
            
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/whatsapp_clicks?select=*&seller_id=eq.${currentSellerId}&clicked_at=gte.${startDate.toISOString()}&order=clicked_at.asc`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                return await response.json();
            } catch (error) {
                console.error('Error fetching whatsapp clicks:', error);
                return [];
            }
        }

        // Fetch seller activities from Supabase
        async function fetchSellerActivities() {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/seller_activities?select=*&seller_id=eq.${currentSellerId}&order=created_at.desc&limit=20`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                return await response.json();
            } catch (error) {
                console.error('Error fetching seller activities:', error);
                return [];
            }
        }

        // Fetch daily stats from Supabase
        async function fetchDailyStats(days = 30) {
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - days);
            const startDateStr = startDate.toISOString().split('T')[0];
            
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/daily_seller_stats?select=*&seller_id=eq.${currentSellerId}&date=gte.${startDateStr}&order=date.asc`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                return await response.json();
            } catch (error) {
                console.error('Error fetching daily stats:', error);
                return [];
            }
        }

        // Fetch products from Supabase
        async function fetchProducts() {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/products?select=*&seller_id=eq.${currentSellerId}`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );
                return await response.json();
            } catch (error) {
                console.error('Error fetching products:', error);
                return [];
            }
        }

        // Group data by date for charts
        function groupByDate(data, dateField) {
            const grouped = {};
            data.forEach(item => {
                const date = new Date(item[dateField]).toLocaleDateString();
                grouped[date] = (grouped[date] || 0) + 1;
            });
            return grouped;
        }

        // Create charts
        function createCharts(dailyStats, productViews, whatsappClicks) {
            const dates = dailyStats.map(d => new Date(d.date).toLocaleDateString());
            const viewsData = dailyStats.map(d => d.total_product_views || 0);
            const clicksData = dailyStats.map(d => d.total_whatsapp_clicks || 0);
            
            // Views Chart
            const ctxViews = document.getElementById('viewsChart')?.getContext('2d');
            if (ctxViews && chartViews) chartViews.destroy();
            if (ctxViews) {
                chartViews = new Chart(ctxViews, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Product Views',
                            data: viewsData,
                            borderColor: '#f90',
                            backgroundColor: 'rgba(255, 153, 0, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: true }
                });
            }
            
            // Clicks Chart
            const ctxClicks = document.getElementById('clicksChart')?.getContext('2d');
            if (ctxClicks && chartClicks) chartClicks.destroy();
            if (ctxClicks) {
                chartClicks = new Chart(ctxClicks, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'WhatsApp Inquiries',
                            data: clicksData,
                            borderColor: '#25D366',
                            backgroundColor: 'rgba(37, 211, 102, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: true }
                });
            }
        }

        // Get top products by views
        async function getTopProducts() {
            const views = await fetchProductViews(30);
            const productStats = {};
            views.forEach(view => {
                const title = view.product_title;
                if (!productStats[title]) {
                    productStats[title] = { views: 0, clicks: 0, productId: view.product_id };
                }
                productStats[title].views++;
            });
            
            const clicks = await fetchWhatsAppClicks(30);
            clicks.forEach(click => {
                const title = click.product_title;
                if (productStats[title]) {
                    productStats[title].clicks++;
                } else {
                    productStats[title] = { views: 0, clicks: 1, productId: click.product_id };
                }
            });
            
            return Object.entries(productStats)
                .sort((a, b) => b[1].views - a[1].views)
                .slice(0, 5);
        }

        // Render analytics page
        async function renderAnalytics() {
            const container = document.getElementById('analyticsContent');
            
            if (!getSellerTier()) {
                container.innerHTML = `
                    <div class="upgrade-message">
                        <h2>Analytics Unlocked</h2>
                        <p>Analytics and insights are available exclusively for paid subscribers.</p>
                        <div style="max-width: 400px; margin: 0 auto 25px auto; background: #f8f9fa; padding: 20px; border-radius: 16px;">
                            <h3 style="margin-bottom: 12px;">What you get:</h3>
                            <ul style="text-align: left; list-style: none;">
                                <li>✓ Product view tracking</li>
                                <li>✓ WhatsApp inquiry analytics</li>
                                <li>✓ Performance charts</li>
                                <li>✓ Top products insights</li>
                            </ul>
                        </div>
                        <button class="btn-primary" onclick="window.location.href='seller-dashboard.html'">View Plans</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '<div class="loading">Loading analytics...</div>';
            
            const [products, productViews, whatsappClicks, dailyStats, topProducts] = await Promise.all([
                fetchProducts(),
                fetchProductViews(30),
                fetchWhatsAppClicks(30),
                fetchDailyStats(30),
                getTopProducts()
            ]);
            
            const totalProducts = products.length;
            const totalViews = productViews.length;
            const totalWhatsapp = whatsappClicks.length;
            const conversionRate = totalViews > 0 ? ((totalWhatsapp / totalViews) * 100).toFixed(1) : 0;
            
            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${totalProducts}</div><div class="stat-label">Total Products</div></div>
                    <div class="stat-card"><div class="stat-number">${totalViews}</div><div class="stat-label">Product Views (30d)</div></div>
                    <div class="stat-card"><div class="stat-number">${totalWhatsapp}</div><div class="stat-label">WhatsApp Inquiries</div></div>
                    <div class="stat-card"><div class="stat-number">${conversionRate}%</div><div class="stat-label">Inquiry Rate</div></div>
                </div>
                
                <div class="two-columns">
                    <div class="section">
                        <h2>Product Views Trend</h2>
                        <div class="chart-container">
                            <canvas id="viewsChart"></canvas>
                        </div>
                    </div>
                    <div class="section">
                        <h2>WhatsApp Inquiries Trend</h2>
                        <div class="chart-container">
                            <canvas id="clicksChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="two-columns">
                    <div class="section">
                        <h2>Top 5 Products (Most Viewed)</h2>
                        ${topProducts.length === 0 ? '<p>No data yet. Share your products to start tracking.</p>' : `
                            <ul class="product-list">
                                ${topProducts.map(([title, stats]) => `
                                    <li>
                                        <span><strong>${escapeHtml(title)}</strong></span>
                                        <span><span class="badge-success" style="background:#f90; padding:4px 12px;">👁️ ${stats.views} views</span> <span class="badge-success" style="background:#25D366;">💬 ${stats.clicks} inquiries</span></span>
                                    </li>
                                `).join('')}
                            </ul>
                        `}
                    </div>
                    <div class="section">
                        <h2>Recent Activity</h2>
                        <div id="activitiesList">Loading activities...</div>
                    </div>
                </div>
            `;
            
            // Load activities separately
            loadActivities();
            
            // Create charts
            createCharts(dailyStats, productViews, whatsappClicks);
        }
        
        async function loadActivities() {
            const activities = await fetchSellerActivities();
            const container = document.querySelector('#activitiesList');
            if (!container) return;
            
            if (activities.length === 0) {
                container.innerHTML = '<p>No recent activities.</p>';
                return;
            }
            
            const activityIcons = {
                'product_added': '🟢 Added product',
                'product_deleted': '🔴 Deleted product',
                'login': '🔵 Logged in',
                'subscription_changed': '🟡 Subscription changed'
            };
            
            container.innerHTML = `
                <ul class="product-list">
                    ${activities.slice(0, 10).map(activity => `
                        <li>
                            <span>${activityIcons[activity.activity_type] || activity.activity_type}</span>
                            <span style="font-size: 12px; color: #666;">${new Date(activity.created_at).toLocaleDateString()}</span>
                        </li>
                    `).join('')}
                </ul>
            `;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
            });
        }
        
        // Initialize
        renderAnalytics();
    </script>
</body>
</html>
