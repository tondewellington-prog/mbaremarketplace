<script>
        // ==================== CONFIGURATION ====================
        window.SUPABASE_URL = 'https://fnncerdxfhwlrdopswpx.supabase.co';
        window.SUPABASE_ANON_KEY = 'sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK';
        const IMGBB_API_KEY = '670ea8c38e955ebdfdf84a41489713bf';
        // Updated to your new Edge Function URL
        const BACKEND_URL = 'https://fnncerdxfhwlrdopswpx.supabase.co/functions/v1/ecocash-callback';

        // ==================== GLOBAL STATE ====================
        // ... (Keep existing global state variables) ...

        // ... (Keep existing IMAGE UPLOAD, AUTH, and SUBSCRIPTION MANAGEMENT functions) ...

        // ==================== UPDATED PAYMENT LOGIC ====================
        function openPaymentModal(planType){
            const plan = tierMap[planType];
            const amount = planType === 'tier_150' ? 1.50 : 5.00; // Use numbers
            
            const div = document.createElement('div');
            div.className = 'payment-modal';
            div.innerHTML = `
                <div class="payment-card">
                    <h3>${plan.name}</h3>
                    <p style="font-size:26px;font-weight:800;color:#B12704;">$${amount}<span style="font-size:14px;">/month</span></p>
                    <div style="margin:20px 0;">
                        <div class="form-group">
                            <label>EcoCash Number *</label>
                            <input type="tel" id="ecoPhone" placeholder="0771234567">
                        </div>
                    </div>
                    <button class="btn-primary" id="confirmPayBtn" style="width:100%;">Pay with EcoCash</button>
                    <button class="btn-secondary" id="closePayModal" style="width:100%;margin-top:10px;">Cancel</button>
                    <div id="paymentStatusArea" style="margin-top:18px;"></div>
                </div>`;
            document.body.appendChild(div);

            document.getElementById('closePayModal').onclick = () => div.remove();

            document.getElementById('confirmPayBtn').onclick = async () => {
                const phone = document.getElementById('ecoPhone').value.trim();
                if (!phone.match(/^(07|078)[0-9]{7}$/)) return alert('Enter valid EcoCash number');

                const btn = document.getElementById('confirmPayBtn');
                btn.disabled = true;
                btn.innerText = 'Processing...';
                
                const statusArea = document.getElementById('paymentStatusArea');
                statusArea.innerHTML = '<div class="text-center"><div class="spinner"></div><p>Requesting PIN prompt...</p></div>';

                // Generate a unique reference for tracking
                const reference = 'MBARE_' + Date.now();
                const userEmail = (localStorage.getItem('supabase_session') ? JSON.parse(localStorage.getItem('supabase_session')).user.email : 'customer@mbare.co.zw');

                try {
                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            amount: amount,
                            phone: phone,
                            ref: reference,
                            email: userEmail
                        })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        statusArea.innerHTML = `
                            <div style="background:#d1ecf1;padding:12px;border-radius:8px;">
                                <strong>✅ PIN Prompt Sent!</strong><br>
                                ${result.instructions || 'Check your phone and enter PIN.'}<br>
                                <small>Waiting for confirmation...</small>
                            </div>`;
                        
                        // Start polling our database for the 'active' status
                        pollPaymentStatus(reference);
                    } else {
                        throw new Error(result.error || 'Failed to initiate payment');
                    }
                } catch (err) {
                    statusArea.innerHTML = `<div style="color:red;">Error: ${err.message}</div>`;
                    btn.disabled = false;
                    btn.innerText = 'Try Again';
                }
            };
        }

        function pollPaymentStatus(ref) {
            // Check the database for the updated status
            const interval = setInterval(async () => {
                try {
                    const resp = await fetch(`${window.SUPABASE_URL}/rest/v1/seller_subscriptions?paynow_reference=eq.${ref}&select=status`, {
                        headers: {
                            'apikey': window.SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${currentAccessToken}`
                        }
                    });
                    
                    const data = await resp.json();
                    if (data && data[0] && data[0].status === 'active') {
                        clearInterval(interval);
                        alert('✅ Payment Confirmed! Your shop is now upgraded.');
                        location.reload(); // Refresh to update product limits
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 5000); // Check every 5 seconds

            // Stop polling after 3 minutes
            setTimeout(() => clearInterval(interval), 180000);
        }

        // ... (Keep the rest of the existing script for products, UI, and init) ...
    </script>
</body>
</html>
