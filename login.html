<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbare Marketplace - Login</title>
<link rel="stylesheet" href="styles.css">

<!-- Load Supabase FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="login-container">
    <div class="login-box">
        <h1>Sign In</h1>

        <!-- LOGIN FORM -->
        <form onsubmit="handleLogin(event)">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <hr>

        <h2>Create Account</h2>

        <!-- REGISTER FORM -->
        <form onsubmit="handleRegister(event)">
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password (min 6)" required>
            <button type="submit">Register</button>
        </form>

        <p id="message" style="margin-top:15px;"></p>
    </div>
</div>

<script>
/* ===============================
   CONNECT TO SUPABASE
================================ */

const supabaseUrl = "https://fnncerdxfhwlrdopswpx.supabase.co"; 
const supabaseKey = "sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK";  
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);


/* ===============================
   LOGIN FUNCTION
================================ */

async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showMessage(error.message, "red");
        return;
    }

    showMessage("Login successful!", "green");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);
}


/* ===============================
   REGISTER FUNCTION
================================ */

async function handleRegister(event) {
    event.preventDefault();

    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    const { error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: name
            }
        }
    });

    if (error) {
        showMessage(error.message, "red");
        return;
    }

    showMessage("Account created! Check your email.", "green");
}


/* ===============================
   MESSAGE FUNCTION
================================ */

function showMessage(text, color) {
    const msg = document.getElementById("message");
    msg.innerText = text;
    msg.style.color = color;
}
</script>

</body>
</html>
