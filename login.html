<!DOCTYPE html>

<html lang="en">
<head>
    <h1 style="color:red;">TEST VERSION</h1>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In To Mbare Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo">
                    <a href="index.html">Mbare Marketplace</a>
                </div>
                <div class="search-bar">
                    <select class="search-category">
                        <option>All</option>
                        <option>Electronics</option>
                        <option>Books</option>
                        <option>Clothing</option>
                        <option>Home & Kitchen</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search Mbare Marketplace" class="search-input">
                    <button class="search-btn">
                        🔍
                    </button>
                </div>
                <div class="header-right">
                    <div class="account-menu">
                        <span class="account-label">Hi there, Sign in</span>
                        <a href="login.html" class="account-link">Account & Lists</a>
                    </div>
                    <div class="returns">
                        <span class="returns-label">Returns</span>
                        <span class="returns-link">& Orders</span>
                    </div>
                    <a href="Basket.html" class="basket">
                        <span class="basket-text">Basket</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Login Content -->
    <div class="login-container">
        <div class="login-box">
            <h1>Sign in</h1>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-login">Sign in</button>
            </form>

            <div class="login-divider">
                New to Mbare Marketplace?
            </div>

            <button class="btn-create-account" onclick="showRegisterForm()">
                Create your Mbare Marketplace account
            </button>

            <!-- Registration Form -->
            <div id="registerForm" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
                <h2 style="margin-bottom: 15px; font-size: 20px;">Create Account</h2>
                <form class="login-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" required minlength="6">
                    </div>
                    <button type="submit" class="btn-login">Create Account</button>
                    <button type="button" class="btn-create-account" style="margin-top:10px;" onclick="hideRegisterForm()">Cancel</button>
                </form>
            </div>

            <p id="message" style="margin-top:15px; text-align:center;"></p>

        </div>
    </div>

<script>
const supabaseUrl = "https://fnncerdxfhwlrdopswpx.supabase.co";
const supabaseKey = "sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showMessage(error.message, "red");
        return;
    }

    showMessage("Login successful!", "green");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 800);
}

async function handleRegister(event) {
    event.preventDefault();

    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;

    const { error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: name
            }
        }
    });

    if (error) {
        showMessage(error.message, "red");
        return;
    }

    showMessage("Account created! Check your email to confirm.", "green");

    hideRegisterForm();
}

function showRegisterForm() {
    document.getElementById('registerForm').style.display = 'block';
}

function hideRegisterForm() {
    document.getElementById('registerForm').style.display = 'none';
}

function showMessage(text, color) {
    const msg = document.getElementById("message");
    msg.innerText = text;
    msg.style.color = color;
}
</script>

</body>
</html>
