<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mbare Marketplace - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase MUST load first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #232F3E;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            opacity: 0.9;
        }

        .switch {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            color: blue;
        }

        .message {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2 id="formTitle">Sign In</h2>

    <form id="authForm">
        <input type="text" id="name" placeholder="Full Name (Register only)" style="display:none;">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Submit</button>
    </form>

    <div class="switch" onclick="toggleMode()">
        Don't have an account? Register
    </div>

    <div class="message" id="message"></div>
</div>

<script>
    // ✅ YOUR SUPABASE DETAILS
    const supabaseUrl = "https://fnncerdxfhwlrdopswpx.supabase.co";
    const supabaseKey = "sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;

        document.getElementById("formTitle").innerText = 
            isLogin ? "Sign In" : "Create Account";

        document.getElementById("name").style.display = 
            isLogin ? "none" : "block";

        document.querySelector(".switch").innerText =
            isLogin ? "Don't have an account? Register" :
                      "Already have an account? Sign In";
    }

    document.getElementById("authForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const name = document.getElementById("name").value;
        const messageBox = document.getElementById("message");

        messageBox.innerText = "Processing...";

        if (isLogin) {
            // LOGIN
            const { error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                messageBox.innerText = error.message;
                messageBox.style.color = "red";
                return;
            }

            messageBox.innerText = "Login successful!";
            messageBox.style.color = "green";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1000);

        } else {
            // REGISTER
            const { error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: name
                    }
                }
            });

            if (error) {
                messageBox.innerText = error.message;
                messageBox.style.color = "red";
                return;
            }

            messageBox.innerText = "Account created! Check your email.";
            messageBox.style.color = "green";
        }
    });
</script>

</body>
</html>
