<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Mbare Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            margin: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f90;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #28a745;
        }
        .error {
            color: #dc3545;
        }
        h2 {
            margin-bottom: 16px;
        }
        p {
            color: #666;
            margin-bottom: 24px;
        }
        .checkmark {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .redirect-message {
            font-size: 14px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <div class="spinner"></div>
        <h2>Processing Your Payment...</h2>
        <p>Please wait while we confirm your subscription.</p>
        <div class="redirect-message">You will be redirected automatically</div>
    </div>

    <script>
        (function() {
            console.log('Payment Return Page Loaded');
            console.log('URL:', window.location.href);
            console.log('Search Params:', window.location.search);
            
            // Get all URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            
            // Log all params for debugging
            const params = {};
            for (const [key, value] of urlParams.entries()) {
                params[key] = value;
            }
            console.log('All URL Parameters:', params);
            
            // Try different possible parameter names from PayNow
            const status = urlParams.get('status') || 
                          urlParams.get('PaymentStatus') || 
                          urlParams.get('result') || 
                          urlParams.get('State') ||
                          urlParams.get('payment_status');
            
            const reference = urlParams.get('reference') || 
                             urlParams.get('paynow_reference') || 
                             urlParams.get('ref') || 
                             urlParams.get('transaction') ||
                             urlParams.get('transaction_id');
            
            const transactionId = urlParams.get('paynowreference') || 
                                 urlParams.get('transaction_id') || 
                                 urlParams.get('id') ||
                                 urlParams.get('guid');
            
            const amount = urlParams.get('amount');
            
            console.log('Extracted - Status:', status);
            console.log('Extracted - Reference:', reference);
            console.log('Extracted - Transaction:', transactionId);
            console.log('Extracted - Amount:', amount);
            
            // Determine payment result
            const isSuccess = status === 'Ok' || status === 'Paid' || status === 'Success' || status === 'APPROVED';
            const isCancelled = status === 'Cancelled' || status === 'Cancel' || status === 'CANCELLED';
            const isError = status === 'Error' || status === 'Failed' || status === 'ERROR';
            
            // If we have a transaction ID but no status, assume success (came from PayNow success page)
            const hasTransactionId = transactionId || reference;
            
            if (isSuccess || (hasTransactionId && !isCancelled && !isError)) {
                // SUCCESSFUL PAYMENT
                console.log('✅ Payment Successful!');
                
                // Store in localStorage for dashboard to read
                localStorage.setItem('payment_success', 'true');
                localStorage.setItem('payment_transaction', transactionId || reference || 'unknown');
                localStorage.setItem('payment_amount', amount || '1.50');
                
                // Update UI
                document.getElementById('statusContainer').innerHTML = `
                    <div class="checkmark success">✅</div>
                    <h2 class="success">Payment Successful!</h2>
                    <p>Your subscription has been activated.</p>
                    <p>Transaction ID: ${(transactionId || reference || 'N/A').substring(0, 20)}...</p>
                    <div class="redirect-message">Redirecting to your dashboard...</div>
                `;
                
                // Redirect to dashboard after 3 seconds
                setTimeout(() => {
                    window.location.href = 'seller-dashboard.html';
                }, 3000);
                
            } else if (isCancelled) {
                // CANCELLED PAYMENT
                console.log('❌ Payment Cancelled');
                
                localStorage.setItem('payment_cancelled', 'true');
                
                document.getElementById('statusContainer').innerHTML = `
                    <div class="checkmark error">❌</div>
                    <h2 class="error">Payment Cancelled</h2>
                    <p>No charges were made to your account.</p>
                    <p>You can try subscribing again.</p>
                    <div class="redirect-message">Redirecting to your dashboard...</div>
                `;
                
                setTimeout(() => {
                    window.location.href = 'seller-dashboard.html';
                }, 3000);
                
            } else if (isError) {
                // FAILED PAYMENT
                console.log('❌ Payment Failed');
                
                localStorage.setItem('payment_cancelled', 'true');
                
                document.getElementById('statusContainer').innerHTML = `
                    <div class="checkmark error">⚠️</div>
                    <h2 class="error">Payment Failed</h2>
                    <p>There was an issue processing your payment.</p>
                    <p>Please try again or contact support.</p>
                    <div class="redirect-message">Redirecting to your dashboard...</div>
                `;
                
                setTimeout(() => {
                    window.location.href = 'seller-dashboard.html';
                }, 3000);
                
            } else {
                // UNKNOWN - but we came from PayNow, assume success
                console.log('⚠️ Unknown status, but came from PayNow - assuming success');
                
                if (hasTransactionId) {
                    localStorage.setItem('payment_success', 'true');
                    localStorage.setItem('payment_transaction', transactionId || reference);
                    localStorage.setItem('payment_amount', amount || '1.50');
                    
                    document.getElementById('statusContainer').innerHTML = `
                        <div class="checkmark success">✅</div>
                        <h2 class="success">Payment Received!</h2>
                        <p>Your subscription is being activated.</p>
                        <div class="redirect-message">Redirecting to your dashboard...</div>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = 'seller-dashboard.html';
                    }, 3000);
                } else {
                    // No payment info - just go back
                    setTimeout(() => {
                        window.location.href = 'seller-dashboard.html';
                    }, 2000);
                }
            }
        })();
    </script>
</body>
</html>
