<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://www.mbaremarketplace.com/forgot-password.html">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Mbare Marketplace</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E %3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== FORGOT PASSWORD PAGE – GLASSMORPHISM ===== */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 20% 50%, #0a1628 0%, #050d1a 100%);
            padding: 20px;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Background bubbles (reuse from main site) */
        .bubble-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble-bg span {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(179, 136, 255, 0.06), rgba(124, 77, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: floatBubble linear infinite;
        }

        .bubble-bg span:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -100px;
            animation-duration: 25s;
            animation-delay: 0s;
        }
        .bubble-bg span:nth-child(2) {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -150px;
            animation-duration: 30s;
            animation-delay: 3s;
        }
        .bubble-bg span:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 40%;
            right: 10%;
            animation-duration: 20s;
            animation-delay: 5s;
        }
        .bubble-bg span:nth-child(4) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            left: 5%;
            animation-duration: 18s;
            animation-delay: 8s;
        }
        .bubble-bg span:nth-child(5) {
            width: 500px;
            height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 35s;
            animation-delay: 2s;
            background: radial-gradient(circle at 30% 30%, rgba(179, 136, 255, 0.03), rgba(124, 77, 255, 0.01));
        }

        @keyframes floatBubble {
            0% { transform: translate(0,0) scale(1) rotate(0deg); opacity:0.3; }
            25% { transform: translate(30px,-40px) scale(1.05) rotate(5deg); opacity:0.6; }
            50% { transform: translate(-20px,20px) scale(0.95) rotate(-3deg); opacity:0.4; }
            75% { transform: translate(40px,-20px) scale(1.02) rotate(2deg); opacity:0.5; }
            100% { transform: translate(0,0) scale(1) rotate(0deg); opacity:0.3; }
        }

        /* Container – Glassmorphism */
        .forgot-container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
        }

        .forgot-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 40px 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo a {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #b388ff, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(179, 136, 255, 0.2);
            letter-spacing: -0.5px;
        }

        .forgot-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #b388ff;
            box-shadow: 0 0 0 3px rgba(179, 136, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b388ff, #7c4dff);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(179, 136, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px 16px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(40, 167, 69, 0.12);
            border: 1px solid rgba(40, 167, 69, 0.25);
            color: #28a745;
            display: block;
        }

        .message.error {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.25);
            color: #ff6b6b;
            display: block;
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer-links a {
            color: #b388ff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .forgot-box {
                padding: 28px 20px;
            }
            .forgot-box h2 {
                font-size: 20px;
            }
            .form-group input {
                padding: 10px 14px;
                font-size: 14px;
            }
            .btn-primary {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ANIMATED BACKGROUND BUBBLES -->
    <div class="bubble-bg">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="forgot-container">
        <div class="forgot-box">
            <div class="logo">
                <a href="index.html">Mbare Marketplace</a>
            </div>

            <h2>Reset Your Password</h2>
            <p class="subtitle">Enter your email address and we will send you a link to reset your password.</p>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input type="email" id="resetEmail" placeholder="you@example.com" required autocomplete="email">
                </div>

                <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
            </form>

            <div id="messageBox" class="message"></div>

            <div class="footer-links">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FORGOT PASSWORD - SUPABASE INTEGRATION
        // ============================================

        const SUPABASE_URL = 'https://fnncerdxfhwlrdopswpx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK';

        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('resetEmail');
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');

        // Get the current site URL
        const siteUrl = window.location.origin;

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = 'message ' + type;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<span class="spinner"></span> Sending...';
            } else {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Link';
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                showMessage('Please enter your email address.', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            hideMessage();
            setLoading(true);

            try {
                const redirectUrl = siteUrl + '/reset-password.html';

                const response = await fetch(SUPABASE_URL + '/auth/v1/recover', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        email: email,
                        redirect_to: redirectUrl
                    })
                });

                if (response.ok) {
                    showMessage(
                        'If an account exists with this email, you will receive a password reset link shortly. Please check your inbox and spam folder.',
                        'success'
                    );
                    emailInput.value = '';
                } else {
                    const error = await response.json();
                    console.error('Reset error:', error);
                    // Always show success for security
                    showMessage(
                        'If an account exists with this email, you will receive a password reset link shortly.',
                        'success'
                    );
                    emailInput.value = '';
                }

            } catch (error) {
                console.error('Send reset error:', error);
                showMessage('Network error. Please check your connection and try again.', 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>
</html>
