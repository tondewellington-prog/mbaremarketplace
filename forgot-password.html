<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Mbare Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo a {
            color: #232f3e;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
        }
        
        .logo a:hover { color: #f90; }
        
        h2 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #232f3e;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        
        input[type="email"]:focus {
            border-color: #f90;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #f90;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #e08500; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: background 0.2s;
        }
        
        .btn-secondary:hover { background: #f5f5f5; }
        
        .message {
            padding: 14px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
            display: block;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
            display: block;
        }
        
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        
        .footer-links a {
            color: #f90;
            text-decoration: none;
        }
        
        .footer-links a:hover { text-decoration: underline; }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="index.html">Mbare Marketplace</a>
        </div>
        
        <h2>Reset Your Password</h2>
        <p class="subtitle">Enter your email address and we will send you a link to reset your password.</p>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" required autocomplete="email">
            </div>
            
            <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
        </form>
        
        <div id="messageBox" class="message"></div>
        
        <div class="footer-links" style="margin-top: 20px;">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script>
        // ============================================
        // FORGOT PASSWORD - SUPABASE INTEGRATION
        // ============================================
        
        const SUPABASE_URL = 'https://fnncerdxfhwlrdopswpx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK';
        
        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('resetEmail');
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');
        
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = 'message ' + type;
            messageBox.style.display = 'block';
        }
        
        function hideMessage() {
            messageBox.style.display = 'none';
        }
        
        function setLoading(isLoading) {
            if (isLoading) {
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<span class="spinner"></span> Sending...';
            } else {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Send Reset Link';
            }
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('Please enter your email address.', 'error');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }
            
            hideMessage();
            setLoading(true);
            
            try {
                const response = await fetch(SUPABASE_URL + '/auth/v1/recover', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({ email: email })
                });
                
                // Always show success even if email not found (security best practice)
                showMessage(
                    'If an account exists with this email, you will receive a password reset link shortly. Please check your inbox and spam folder.',
                    'success'
                );
                emailInput.value = '';
                
            } catch (error) {
                console.error('Send reset error:', error);
                showMessage('Network error. Please check your connection and try again.', 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
