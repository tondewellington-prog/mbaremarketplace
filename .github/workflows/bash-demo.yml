name: Run Bash Commands

# Event trigger: Run on push to main branch OR manually from GitHub UI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bash-script:
    runs-on: ubuntu-latest # Options: ubuntu-latest, macos-latest, windows-latest

    steps:
      # Step 1: Check out the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Single-line inline Bash command
      - name: Run Single Command
        run: echo "Hello from GitHub Actions Bash!"

      # Step 3: Multi-line inline Bash script (use '|' operator)
      - name: Run Multi-line Bash Script
        run: |
          echo "Starting build step..."
          date
          mkdir -p build_output
          echo "Build successful" > build_output/status.txt
          cat build_output/status.txt

      # Step 4: Execute an existing shell script from your repository
      - name: Make Script Executable and Run
        run: |
          chmod +x ./scripts/my-script.sh
          ./scripts/my-script.sh
