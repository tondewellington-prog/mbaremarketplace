<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Mbare Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Minimal page-specific styles - everything else comes from styles.css */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body class="search-results">

    <!-- Background Bubbles -->
    <div class="bubble-bg">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="container">
                <div class="logo">
                    <a href="index.html">Mbare Marketplace</a>
                </div>
                <div class="header-right">
                    <a href="index.html" class="account-link">Home</a>
                    <a href="seller-dashboard.html" class="account-link">Sell</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Search Results Content -->
    <main class="main-content">
        <div class="container">
            <a href="index.html" class="back-link">&#8592; Back to Home</a>

            <div class="search-header">
                <h1 id="searchTitle">Search Results</h1>
                <p id="searchDescription">Showing results for your search</p>
            </div>

            <div class="search-controls">
                <span class="results-count" id="resultsCount">Loading...</span>
                <div class="sort-wrapper">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="relevance">Relevance</option>
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>
                <div class="search-again">
                    <input type="text" id="searchInput" placeholder="Search again..." value="">
                    <button onclick="performSearch()">Search</button>
                </div>
            </div>

            <div id="loadingSpinner" class="loading-spinner">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>

            <div id="resultsGrid" class="products-grid"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="container">
                <div class="footer-bottom">
                    <div class="container">
                        <span class="footer-copyright">&copy; 2026 Mbare Marketplace. All rights reserved.</span>
                        <div class="footer-links">
                            <a href="index.html">Home</a>
                            <a href="seller-dashboard.html">Sell</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Search results functionality
        const SUPABASE_URL = window.SUPABASE_URL || 'https://fnncerdxfhwlrdopswpx.supabase.co';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK';

        let searchQuery = '';
        let allResults = [];
        let filteredResults = [];

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                q: params.get('q') || ''
            };
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function performSearch() {
            const input = document.getElementById('searchInput');
            const query = input ? input.value.trim() : searchQuery;
            if (!query) {
                window.location.href = 'index.html';
                return;
            }
            window.location.href = `search-results.html?q=${encodeURIComponent(query)}`;
        }

        async function fetchSearchResults(query) {
            const loadingSpinner = document.getElementById('loadingSpinner');
            const resultsGrid = document.getElementById('resultsGrid');
            const resultsCount = document.getElementById('resultsCount');
            const searchTitle = document.getElementById('searchTitle');
            const searchDescription = document.getElementById('searchDescription');

            if (loadingSpinner) loadingSpinner.style.display = 'block';
            if (resultsGrid) resultsGrid.innerHTML = '';

            if (searchTitle) searchTitle.textContent = `Search Results for "${escapeHtml(query)}"`;
            if (searchDescription) searchDescription.textContent = `Showing results for "${escapeHtml(query)}"`;

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/products?title=ilike.%25${encodeURIComponent(query)}%25&select=*&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error('Search failed');
                }

                const products = await response.json();
                allResults = products;
                filteredResults = products;

                if (loadingSpinner) loadingSpinner.style.display = 'none';

                if (resultsCount) {
                    resultsCount.textContent = `${products.length} result${products.length !== 1 ? 's' : ''} found`;
                }

                renderResults(products);

            } catch (error) {
                console.error('Search error:', error);
                if (loadingSpinner) loadingSpinner.style.display = 'none';
                if (resultsGrid) {
                    resultsGrid.innerHTML = `
                        <div class="no-results">
                            <span class="no-results-icon">&#9888;</span>
                            <p>Something went wrong. Please try again.</p>
                        </div>
                    `;
                }
            }
        }

        function renderResults(products) {
            const resultsGrid = document.getElementById('resultsGrid');
            if (!resultsGrid) return;

            if (!products || products.length === 0) {
                resultsGrid.innerHTML = `
                    <div class="no-results">
                        <span class="no-results-icon">&#128269;</span>
                        <p>No products found matching your search.</p>
                        <div class="suggestions">
                            Try different keywords or <a href="index.html">browse all products</a>
                        </div>
                    </div>
                `;
                return;
            }

            let html = '';
            products.forEach(product => {
                const stock = product.stock !== null && product.stock !== undefined ? parseInt(product.stock) : 0;
                const stockText = stock > 0 ? 'In Stock' : 'Out of Stock';
                const stockClass = stock > 0 ? 'in-stock' : 'out-of-stock';
                const imageUrl = product.image_url || 'https://via.placeholder.com/300x300?text=Product';

                html += `
                    <div class="product-card" onclick="goToProduct('${product.id}')">
                        <img src="${imageUrl}" alt="${escapeHtml(product.title)}" onerror="this.src='https://via.placeholder.com/300x300?text=Product'">
                        <div class="product-info">
                            <div class="product-title">${escapeHtml(product.title)}</div>
                            <div class="product-price">$${parseFloat(product.price).toFixed(2)}</div>
                            <div class="product-stock ${stockClass}">${stockText}</div>
                            ${product.category ? `<div class="product-category-tag">${escapeHtml(product.category)}</div>` : ''}
                            <div class="product-seller">${escapeHtml(product.seller_name || 'Seller')}</div>
                            <div class="product-actions">
                                <button class="btn-add-cart" onclick="event.stopPropagation(); addToCart('${product.id}')">Add to Basket</button>
                                <button class="btn-contact-seller" onclick="event.stopPropagation(); contactSeller('${product.id}')">Contact Seller</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            resultsGrid.innerHTML = html;
        }

        function sortResults(sortType) {
            if (!allResults || allResults.length === 0) return;

            let sorted = [...allResults];

            switch (sortType) {
                case 'newest':
                    sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    break;
                case 'oldest':
                    sorted.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                    break;
                case 'price-low':
                    sorted.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
                    break;
                case 'price-high':
                    sorted.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
                    break;
                case 'name':
                    sorted.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                    break;
                case 'relevance':
                default:
                    break;
            }

            filteredResults = sorted;
            renderResults(sorted);
        }

        function goToProduct(productId) {
            window.location.href = `product-detail.html?id=${productId}`;
        }

        function addToCart(productId) {
            const sessionData = localStorage.getItem('supabase_session');
            if (!sessionData) {
                window.location.href = 'login.html';
                return;
            }
            const session = JSON.parse(sessionData);
            const basketKey = `basket_${session.user.id}`;
            let basket = JSON.parse(localStorage.getItem(basketKey)) || [];
            const product = allResults.find(p => p.id == productId);
            if (!product) return;

            const existingItem = basket.find(item => item.id == productId);
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                basket.push({ ...product, quantity: 1 });
            }

            localStorage.setItem(basketKey, JSON.stringify(basket));
            const count = basket.reduce((sum, item) => sum + (item.quantity || 1), 0);
            updateBasketCount(count);
            showToast('Item added to basket!');
        }

        function contactSeller(productId) {
            const product = allResults.find(p => p.id == productId);
            if (!product) return;
            if (product.seller_id) {
                window.location.href = `shop.html?seller=${product.seller_id}`;
            } else {
                showToast('Seller information not available', true);
            }
        }

        function updateBasketCount(count) {
            const el = document.getElementById('basketCount');
            if (el) {
                el.textContent = count;
                el.style.display = count > 0 ? 'flex' : 'none';
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-notification' + (isError ? ' error' : '');
            toast.style.cssText = `
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bubble-glass);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid var(--bubble-glass-border);
                border-radius: 12px;
                padding: 14px 28px;
                color: #fff;
                font-weight: 500;
                z-index: 99999;
                box-shadow: 0 8px 32px rgba(0,0,0,0.4);
                animation: fadeIn 0.3s ease;
                max-width: 90%;
                text-align: center;
                ${isError ? 'border-color: #dc3545;' : ''}
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function initSearchPage() {
            const params = getUrlParams();
            searchQuery = params.q || '';

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.value = searchQuery;
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }

            if (searchQuery) {
                fetchSearchResults(searchQuery);
            } else {
                const loadingSpinner = document.getElementById('loadingSpinner');
                if (loadingSpinner) loadingSpinner.style.display = 'none';
                const resultsGrid = document.getElementById('resultsGrid');
                if (resultsGrid) {
                    resultsGrid.innerHTML = `
                        <div class="no-results">
                            <span class="no-results-icon">&#128269;</span>
                            <p>Please enter a search term.</p>
                            <div class="suggestions">
                                <a href="index.html">Browse all products</a>
                            </div>
                        </div>
                    `;
                }
                const resultsCount = document.getElementById('resultsCount');
                if (resultsCount) resultsCount.textContent = '0 results';
            }

            const sortSelect = document.getElementById('sortSelect');
            if (sortSelect) {
                sortSelect.addEventListener('change', function() {
                    sortResults(this.value);
                });
            }

            const sessionData = localStorage.getItem('supabase_session');
            if (sessionData) {
                const session = JSON.parse(sessionData);
                const basket = JSON.parse(localStorage.getItem(`basket_${session.user.id}`)) || [];
                updateBasketCount(basket.reduce((sum, item) => sum + (item.quantity || 1), 0));
            }
        }

        // Make functions globally available
        window.performSearch = performSearch;
        window.goToProduct = goToProduct;
        window.addToCart = addToCart;
        window.contactSeller = contactSeller;

        // Start the page
        document.addEventListener('DOMContentLoaded', initSearchPage);
    </script>

</body>
</html>
