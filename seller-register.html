<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Registration - Mbare Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container" style="max-width:600px;margin:50px auto;background:white;padding:30px;border-radius:6px;">
    <h2>Register as a Seller</h2>

    <form id="sellerForm">
        <div class="form-group">
            <label>Business Name *</label>
            <input type="text" id="businessName" required>
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" id="phoneNumber" required>
        </div>

        <div class="form-group">
            <label>Business Address *</label>
            <input type="text" id="businessAddress" required>
        </div>

        <button type="submit" class="btn-login">Register</button>
    </form>

    <div id="message" style="margin-top:20px;"></div>
</div>

<script>
const SUPABASE_URL = 'https://fnncerdxfhwlrdopswpx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qjN17tdmLu5yvp9iIUBEjg_ZDZCWMhK';

document.getElementById('sellerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const sessionData = localStorage.getItem('supabase_session');
    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

    if (!isLoggedIn || !sessionData) {
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    const session = JSON.parse(sessionData);
    const userId = session.user.id;
    const accessToken = session.access_token;

    const sellerData = {
        user_id: userId,
        business_name: document.getElementById("businessName").value,
        phone: document.getElementById("phoneNumber").value,
        address: document.getElementById("businessAddress").value,
        status: "pending",
        created_at: new Date().toISOString()
    };

    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/sellers`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${accessToken}`
            },
            body: JSON.stringify(sellerData)
        });

        if (response.ok) {
            document.getElementById("message").innerHTML =
                "<div style='color:green;'>Registration successful! Redirecting...</div>";

            setTimeout(() => {
                window.location.href = "seller-dashboard.html";
            }, 1500);
        } else {
            const error = await response.json();
            alert("Error: " + (error.message || "Registration failed"));
        }

    } catch (err) {
        alert("Network error: " + err.message);
    }
});
</script>

</body>
</html>
